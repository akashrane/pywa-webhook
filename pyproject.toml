[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pywa-webhook"
version = "0.1.0"
description = "Receive, verify, and parse Meta WhatsApp Cloud API webhooks in Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akash Rane" }]
keywords = ["whatsapp", "meta", "webhook", "cloud-api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/akashrane/pywa-webhook"
Repository = "https://github.com/akashrane/pywa-webhook"
Issues = "https://github.com/akashrane/pywa-webhook/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pywa_webhook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
